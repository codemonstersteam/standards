# Источник правды стандарта release. Артефакты генерируются:
# node tools/generate.mjs. Проза — в prose/ (rationale); нормативы — двумя группами ниже.
id: release
name: release
title: релиз — SemVer по совместимости + feature toggles
description: >-
  SemVer — вес задачи определяется совместимостью контракта; feature toggles —
  новая способность едет выключенной. Использовать при классификации изменений,
  выпуске версий и добавлении фич. Детерминированных проверок нет (guidance).
summary: SemVer по совместимости + feature toggles default OFF
enforcement: model
sections:
  - rules:semver
  - rules:toggles
  - legacy
  - checks
  - stop
  - rationale.md
rule_groups:
  semver:
    heading: "## SemVer: вес = совместимость"
    items:
      - |-
        Единственная ось веса задачи — **совместимость задокументированного
        контракта** (SemVer 2.0.0 дословно): ломает контракт → `major`; добавляет
        способность → `minor`; иначе совместимое исправление → `patch`.
      - |-
        Багфикс, который сам ломает совместимость, — это **`major`**, не patch.
      - |-
        Только «сантехника» (lock-файлы, конфиги линтеров, CI-обвязка) — без тега.
        Всё неизвестное — продуктовое: лишний patch-тег дёшев, потерянная версия
        продуктового изменения — дорога.
      - |-
        Версия = git-тег на транке; VERSION-файлов нет — нечему разъезжаться.
        Тег ставится **только на влитый в транк** (после человеческого мержа),
        не на ветку.
      - |-
        Канаречный выпуск — пререлиз `X.Y.Z-canary.N`; канарейка не двигает базу
        версии.
  toggles:
    heading: "## Feature toggles"
    items:
      - |-
        **Вся новая способность едет за тогглом, default OFF.** Фича попадает в
        прод выключенной и открывается доле аудитории постепенно.
      - |-
        Тоггл зарегистрирован в системе управления тогглами; имя тоггла живёт в
        плане задачи.
      - |-
        **Включение — отдельный прогон оператора** (не входит в задачу-разработку):
        1% → 5% → 25% → 100% с наблюдением.
      - |-
        Тоггл — рычаг отката: RED-инцидент → тоггл OFF.
      - |-
        После 100% и стабилизации — тикет на удаление тоггла; мёртвые тогглы не копятся.
      - |-
        Ревьюер не принимает правки тестов/CI/логики тогглов, чтобы «позеленить» сборку.
legacy: |-
  Классифицируй по этим правилам новые изменения; ретроактивная тагировка истории
  не требуется. Если релизный процесс команды другой — правила применяются к
  новым версиям, договорённость о переходе фиксируется с оператором.
checks_section:
  heading: "## Что проверяет скрипт"
  no_checks_text: |-
    Ничего (guidance): детерминированный расчёт тега — уровень CI-рецепта, не
    локальной петли. Проверяй осознанно при подготовке PR.
checks: []
stop:
  - |-
    изменение ломает замороженный контракт (значит `major`) — сначала STOP
    и вопрос оператору, затем контракт по схеме `box-spec`;
  - |-
    способность нельзя спрятать за тогглом (например, миграция схемы БД) —
    согласуй стратегию выпуска с оператором явно.
