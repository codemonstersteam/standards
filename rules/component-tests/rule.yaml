# Источник правды стандарта component-tests. Артефакты генерируются:
# node tools/generate.mjs. Проза — в prose/.
id: component-tests
name: component-tests
title: компонентные тесты — исполняемая спецификация
description: >-
  Компонентные тесты — исполняемая спецификация коробки. Использовать при
  создании/изменении component-tests/**/*.feature и при проектировании срезов.
  Детерминированно проверяется check-component-tests (счёт по формуле, @wip,
  smoke, дубли).
summary: Компонентные тесты — исполняемая спецификация по формуле
enforcement: hybrid
sections:
  - essence.md
  - rules:hard
  - legacy
  - checks
  - stop
  - rationale.md
rule_groups:
  hard:
    heading: "## Hard rules"
    items:
      - |-
        **Чёрный ящик.** Тестируем через реальный интерфейс коробки (HTTP/CLI/очередь):
        запуск в Docker Compose, стабы внешних провайдеров — по их реальному протоколу,
        не моки в памяти.
      - |-
        **Формула.** `N = 1 (happy path) + Σ (различимые ветки адаптера i)` на срез.
        Один компонентный сценарий ⇔ один Extension юзкейса. Сценариев ровно N:
        пропущенный или выдуманный сценарий — ошибка проектирования.
      - |-
        **`@wip` до фиксации.** Все бизнес-сценарии держатся `@wip`; снятие `@wip` —
        акт фиксации результата (фиксером), не автора сценария. Минимум один `@smoke`.
      - |-
        **Границы — не компоненты.** Ветвление по полям `Request`, разбор формата,
        валидация диапазонов — юнит-тесты (см. `modules`). Компонент — только
        различимые ветки внешних адаптеров.
      - |-
        **Добавить/убрать/слить сценарий — акт дизайна**: сначала формула и юзкейс,
        потом `.feature`. Реализация воспроизводит спроектированное ровно.
legacy: |-
  Формула сверяется только если дизайн её объявил (`docs/design/**/contracts.md`).
  Существующие сценарии без `@wip` — замечание (warn), не блок: приводи к
  дисциплине при касании файла.
checks_section:
  heading: "## Что проверяет скрипт"
  join: " "
checks:
  - check: check-component-tests
    paths: ["component-tests/**", "docs/design/**"]
    severity: warn
stop:
  - |-
    число сценариев не сходится с дизайном — добавить/убрать/слить сценарий может
    только проектировщик, не реализация;
  - |-
    тест требует мока внешней системы вместо стаба по протоколу — стоп, это скрывает
    реальный отказ интегратора.
