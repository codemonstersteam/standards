# Источник правды стандарта box-spec. Артефакты (skills/box-spec/SKILL.md,
# standards.json) генерируются: node tools/generate.mjs. Проза — в prose/.
id: box-spec
name: box-spec
title: коробка начинается со спецификации + Doc as Code
description: >-
  Проектирование начинается со спецификации коробки (сервиса, утилиты, компонента —
  всего, что предоставляет API) и Doc as Code: контракт первичен и заморожен, README
  описывает pipe и отказы. Использовать при создании/изменении контракта, README или
  публичного поведения. Детерминированно проверяется check-api-spec и check-docs.
summary: Коробка начинается со спецификации + Doc as Code
enforcement: hybrid
sections:
  - essence.md
  - rules:hard
  - legacy
  - checks
  - stop
  - rationale.md
rule_groups:
  hard:
    heading: "## Hard rules"
    items:
      - |-
        **Контракт первичен и заморожен.** Машинный контракт (`api-specification/openapi.yaml`,
        `asyncapi.yaml` или JSON Schema для CLI) описан до реализации и помечен
        `x-frozen: <дата>`. Изменение поведения = сначала контракт, потом код.
        Breaking замороженного контракта — STOP, вопрос оператору.
      - |-
        **Ошибки исчерпывающи над юзкейсом.** Каждый видимый потребителю отказ —
        явный `error.code` в контракте: `#error responses (путь) == #Extensions юзкейса`.
        Маскировать отказ под успех запрещено.
      - |-
        **Один data-input на операцию.** Ровно одно тело запроса/сущность; два —
        значит, не хватает доменной схемы. Флаги/опции — поля этой сущности.
      - |-
        **Doc as Code.** Документация живёт в репо и выводится из замороженного
        контракта (`spec → docs → code`), не из исходников. У каждого артефакта
        ровно один дом: контракт — в `api-specification/`, как работает — pipe в
        README, дизайн среза — в `docs/design/<slice>/`, решения — в ADR.
      - |-
        **README коробки**: границы (Может / Не может), API-таблица из контракта,
        **pipe-описание** (как данные текут по шагам и где ломается — человекочитаемая
        копия head-pipe из скилла `modules`), таблица отказов со всеми `error.code`.
legacy: |-
  Правила действуют на новый и изменяемый код. Существующий README и контракт не
  требуют немедленной переделки: при касании файла приводи его к форме; отсутствие
  `x-frozen`/pipe — замечание (warn), не блок. Контракта нет и коробка не меняется —
  проверки молчат.
checks_section:
  heading: "## Что проверяет скрипт"
  join: " "
checks:
  - check: check-api-spec
    paths: ["api-specification/**"]
    severity: warn
  - check: check-docs
    paths: ["api-specification/**", "README.md"]
    severity: warn
stop:
  - |-
    нужно ломать замороженный контракт или снять `x-frozen` — это смена контракта,
    вопрос оператору;
  - |-
    потребительский отказ не выражается кодом в контракте — расширяй спецификацию,
    а не изобретай код по ходу.
